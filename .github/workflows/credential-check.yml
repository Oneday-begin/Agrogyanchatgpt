name: Credential protection

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install PDF reader for binary document checks
        run: python3 -m pip install pypdf==6.10.2
      - name: Scan current tracked files and public knowledge bundles
        run: python3 tools/check_credentials.py
      - name: Select the newly introduced history
        id: revisions
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            echo "range=$BEFORE..$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "range=$GITHUB_SHA^..$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan all new blobs, including secrets removed in a later commit
        env:
          REVISION: ${{ steps.revisions.outputs.range }}
        run: python3 tools/check_credentials.py --range "$REVISION"
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Run provider and administrator password rules with redacted output
        env:
          REVISION: ${{ steps.revisions.outputs.range }}
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config=.gitleaks.toml --log-opts="$REVISION" --redact=100 --no-banner
